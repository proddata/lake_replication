services:
  source:
    image: ${PUSH_PG_LAKE_IMAGE:?select the pinned pg_lake runtime image}
    environment:
      POSTGRES_DB: capture
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/18/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - output_plugin_libraries=pgoutput,test_decoding,lake_replication_capture
      - -c
      - max_worker_processes=24
      - -c
      - max_slot_wal_keep_size=1024MB
      - -c
      - shared_preload_libraries=pg_extension_base
      - -c
      - pg_lake_engine.host=host=/var/run/pgduck port=5332
      - -c
      - pg_lake_iceberg.default_location_prefix=s3://lake-push/iceberg
    volumes:
      - source-data:/var/lib/postgresql/18/data
      - pgduck-socket:/var/run/pgduck
      - ./init:/docker-entrypoint-initdb.d:ro
    depends_on:
      pgduck:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "psql -XAt -U postgres -d capture -c \"SELECT count(*) FROM pg_extension WHERE extname='pg_lake'\" | grep -qx 1"]
      interval: 2s
      timeout: 3s
      retries: 60
    shm_size: 256mb
  pgduck:
    image: ${PUSH_PG_LAKE_IMAGE:?select the pinned pg_lake runtime image}
    user: postgres
    entrypoint: [pgduck_server]
    command: [--unix_socket_directory, /var/run/pgduck, --port, '5332', --memory_limit, 1GB, --cache_dir, /tmp/pgduck-cache, --init_file_path, /push/pgduck.sql]
    volumes:
      - source-data:/var/lib/postgresql/18/data
      - pgduck-socket:/var/run/pgduck
      - ./pgduck.sql:/push/pgduck.sql:ro
    depends_on:
      permissions:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, psql, -h, /var/run/pgduck, -p, '5332', -U, postgres, -d, postgres, -c, SELECT 1]
      interval: 2s
      timeout: 3s
      retries: 60
  permissions:
    image: ${PUSH_PG_LAKE_IMAGE:?select the pinned pg_lake runtime image}
    user: root
    entrypoint: [chown, postgres:postgres, /var/run/pgduck]
    volumes:
      - pgduck-socket:/var/run/pgduck
  storage:
    image: ${PUSH_STORAGE_IMAGE:?select the pinned qualification MinIO image}
    command: server /data
    environment:
      MINIO_ROOT_USER: lake-push
      MINIO_ROOT_PASSWORD: push-fixture-only
    volumes:
      - object-data:/data
  storage-init:
    image: ${PUSH_STORAGE_INIT_IMAGE:?select the pinned qualification MinIO client image}
    depends_on: [storage]
    volumes:
      - ./policies:/push/policies:ro
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for attempt in $$(seq 1 60); do
          if mc alias set push http://storage:9000 lake-push push-fixture-only; then
            mc mb --ignore-existing push/lake-push
            mc admin user add push lake-source-capture source-capture-fixture-only
            mc admin policy create push source-capture /push/policies/source.json
            mc admin policy attach push source-capture --user lake-source-capture
            mc admin user add push lake-destination-publish destination-publish-fixture-only
            mc admin policy create push destination-publish /push/policies/destination.json
            mc admin policy attach push destination-publish --user lake-destination-publish
            exit 0
          fi
          sleep 1
        done
        exit 1
volumes:
  source-data:
  pgduck-socket:
  object-data:
