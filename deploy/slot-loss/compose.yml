name: pg-lake-replication-slot-loss-lab
services:
  source:
    image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: application
      PGDATA: /var/lib/postgresql/18/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=8
      - -c
      - max_slot_wal_keep_size=1MB
      - -c
      - min_wal_size=32MB
      - -c
      - max_wal_size=64MB
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d application"]
      interval: 1s
      timeout: 2s
      retries: 60
    volumes:
      - source-data:/var/lib/postgresql/18/data

volumes:
  source-data:
