scope: lake-ha
namespace: /service/
name: pg1

restapi:
  listen: 0.0.0.0:8008
  connect_address: pg1:8008

etcd3:
  host: etcd:2379

bootstrap:
  dcs:
    ttl: 20
    loop_wait: 2
    retry_timeout: 5
    check_timeline: true
    maximum_lag_on_failover: 0
    synchronous_mode: true
    synchronous_mode_strict: false
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        hot_standby_feedback: "on"
        max_connections: 100
        max_replication_slots: 16
        max_wal_senders: 16
        sync_replication_slots: "on"
        wal_keep_size: 128MB
        wal_level: logical
        wal_log_hints: "on"
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    - local all all trust
    - host all all 0.0.0.0/0 trust
    - host replication replicator 0.0.0.0/0 trust

postgresql:
  listen: 0.0.0.0:5432
  connect_address: pg1:5432
  data_dir: /var/lib/postgresql/18/data
  bin_dir: /usr/lib/postgresql/18/bin
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: replicate
    superuser:
      username: postgres
      password: postgres
  parameters:
    unix_socket_directories: /var/run/postgresql

tags:
  clonefrom: true
  failover_priority: 1
  noloadbalance: false
  nosync: false
