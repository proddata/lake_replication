# Local-host comparison only; plain source uses the exact destination PG binary.
services:
  remote-source:
    image: ${PUSH_PG_LAKE_IMAGE:?select the pinned pg_lake runtime image}
    environment:
      POSTGRES_DB: capture
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /var/lib/postgresql/18/data
    command: [postgres, -c, wal_level=logical, -c, max_worker_processes=24, -c, max_slot_wal_keep_size=1024MB]
    volumes:
      - remote-source-data:/var/lib/postgresql/18/data
      - ./remote-source-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d capture']
      interval: 2s
      timeout: 3s
      retries: 60
    shm_size: 256mb
volumes:
  remote-source-data:
