# Diagnostic-only nested SQL timing; layer over the local sizing fixture.
services:
  postgres:
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_worker_processes=24
      - -c
      - max_slot_wal_keep_size=1024MB
      - -c
      - shared_preload_libraries=pg_extension_base,pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.track_planning=on
      - -c
      - pg_stat_statements.max=20000
      - -c
      - pg_lake_engine.host=host=/var/run/pgduck port=5332
      - -c
      - pg_lake_iceberg.default_location_prefix=s3://lake-push/iceberg
