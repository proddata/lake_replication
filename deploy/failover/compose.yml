name: pg-lake-replication-failover-lab
services:
  primary:
    image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: application
      PGDATA: /var/lib/postgresql/18/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=16
      - -c
      - max_wal_senders=16
      - -c
      - synchronized_standby_slots=ha_standby
    volumes:
      - primary-data:/var/lib/postgresql/18/data
      - ./primary-hba.sh:/docker-entrypoint-initdb.d/09-primary-hba.sh:ro
      - ./primary-init.sql:/docker-entrypoint-initdb.d/10-primary.sql:ro
    ports:
      - "127.0.0.1:55435:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d application"]
      interval: 1s
      timeout: 2s
      retries: 60

  standby-permissions:
    image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    user: root
    entrypoint: [chown, postgres:postgres, /var/lib/postgresql/18/data]
    volumes:
      - standby-data:/var/lib/postgresql/18/data

  standby:
    image: postgres:18-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    user: postgres
    environment:
      PGDATA: /var/lib/postgresql/18/data
    entrypoint: [bash, /lab/standby.sh]
    volumes:
      - standby-data:/var/lib/postgresql/18/data
      - ./standby.sh:/lab/standby.sh:ro
    ports:
      - "127.0.0.1:55436:5432"
    depends_on:
      primary:
        condition: service_healthy
      standby-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "psql -U postgres -d application -Atc 'SELECT pg_is_in_recovery()' | grep -qx t"]
      interval: 1s
      timeout: 2s
      retries: 90

volumes:
  primary-data:
  standby-data:
