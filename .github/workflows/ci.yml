name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Rust 1.85
        run: |
          rustup toolchain install 1.85 --profile minimal --component rustfmt
          rustup default 1.85
      - name: Check
        run: make check

  bundle-amd64:
    name: bundle (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build amd64 bundle
        run: ARCHES=amd64 make install-bundles
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: install-bundle-amd64
          path: |
            dist/release/*-linux-amd64.tar.gz
            dist/release/*-linux-amd64.tar.gz.sha256
          if-no-files-found: error

  bundle-arm64:
    name: bundle (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build arm64 bundle natively
        run: ARCHES=arm64 make install-bundles
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: install-bundle-arm64
          path: |
            dist/release/*-linux-arm64.tar.gz
            dist/release/*-linux-arm64.tar.gz.sha256
          if-no-files-found: error

  artifact-security:
    name: artifact security and notices
    needs: [check, bundle-amd64, bundle-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: install-bundle-*
          merge-multiple: true
          path: dist/release
      - name: Install checksum-pinned audit tools
        env:
          SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
          GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
        run: |
          mkdir -p "$RUNNER_TEMP/lake-audit-tools"
          cd "$RUNNER_TEMP/lake-audit-tools"
          curl --fail --location --retry 3 https://github.com/anchore/syft/releases/download/v1.55.0/syft_1.55.0_linux_amd64.tar.gz -o syft.tar.gz
          curl --fail --location --retry 3 https://github.com/anchore/grype/releases/download/v0.121.0/grype_0.121.0_linux_amd64.tar.gz -o grype.tar.gz
          echo "$SYFT_SHA256  syft.tar.gz" | sha256sum -c -
          echo "$GRYPE_SHA256  grype.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          tar -xzf grype.tar.gz grype
          echo "$RUNNER_TEMP/lake-audit-tools" >> "$GITHUB_PATH"
      - name: Audit both exported archives
        run: python3 tests/qualification/security.py --expected-revision "$GITHUB_SHA" dist/release/*.tar.gz
      - name: Upload SBOMs and vulnerability evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-security-evidence
          path: .qualification/security_*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  qualify-amd64:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [check, bundle-amd64]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: install-bundle-amd64
          path: dist/release
      - name: Build and verify source-pinned storage fixtures
        run: python3 tests/qualification/storage_preflight.py
      - name: Qualify amd64 archive on PostgreSQL 18 with pg_lake
        env:
          QUALIFICATION_ARCHIVE: ${{ github.workspace }}/dist/release/lake_replication-0.1.0-beta.5-linux-amd64.tar.gz
        run: make qualification-test
      - name: Upload qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: amd64-qualification-evidence
          path: .qualification/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
