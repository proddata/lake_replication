name: Packaged lifecycle qualification

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful default-branch push CI run for this exact workflow commit
        required: true
        type: string

      fairness_diagnostic:
        description: Run one/four/one-copy controls only (does not qualify a release)
        required: false
        default: false
        type: boolean

      native_probe:
        description: Run migration, managed admission and one four-copy probe (not release qualification)
        required: false
        default: false
        type: boolean

      probe_arch:
        description: Architecture for a focused native probe (full qualification always uses both)
        required: false
        default: both
        type: choice
        options:
          - both
          - arm64
          - amd64

      checkpoint_split_diagnostic:
        description: Test the disposable checkpoint SQL overlay (ARM64 native probe only; not release qualification)
        required: false
        default: false
        type: boolean

      checkpoint_split_comparison:
        description: Original/split/original on one ARM64 runner (performance diagnostic only)
        required: false
        default: false
        type: boolean

      copy_chunk_comparison:
        description: Split-checkpoint 1000/candidate/1000 copy row-cap comparison (ARM64 diagnostic only)
        required: false
        default: disabled
        type: choice
        options:
          - disabled
          - '2000'
          - '4000'

      staging_chunk_comparison:
        description: Per-row/chunk/per-row staging with unchanged copy limits (ARM64 diagnostic only)
        required: false
        default: false
        type: boolean

      staging_chunk_pause_ms:
        description: With staging chunk comparison, run unpaced/paced/unpaced chunks (diagnostic only)
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '40'

      copy_configuration_comparison:
        description: Fixed comparisons, transaction timing or manifest cleanup prototype (native diagnostic only)
        required: false
        default: disabled
        type: choice
        options:
          - disabled
          - pacing
          - toast
          - transaction_trace
          - transaction_trace_phases
          - manifest_cleanup
          - manifest_patch

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    name: lifecycle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.native_probe && inputs.probe_arch == 'arm64' && '[{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' || inputs.native_probe && inputs.probe_arch == 'amd64' && '[{"arch":"amd64","runner":"ubuntu-latest"}]' || '[{"arch":"amd64","runner":"ubuntu-latest"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.native_probe && 90 || 180 }}
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      QUALIFICATION_ARCHIVE: ${{ github.workspace }}/dist/release/lake_replication-0.1.0-beta.5-linux-${{ matrix.arch }}.tar.gz
    steps:
      - name: Validate probe selection
        env:
          NATIVE_PROBE: ${{ inputs.native_probe }}
          FAIRNESS_DIAGNOSTIC: ${{ inputs.fairness_diagnostic }}
          PROBE_ARCH: ${{ inputs.probe_arch }}
          CHECKPOINT_SPLIT: ${{ inputs.checkpoint_split_diagnostic }}
          CHECKPOINT_COMPARE: ${{ inputs.checkpoint_split_comparison }}
          COPY_CHUNK: ${{ inputs.copy_chunk_comparison }}
          STAGING_CHUNKS: ${{ inputs.staging_chunk_comparison }}
          STAGING_PAUSE: ${{ inputs.staging_chunk_pause_ms }}
          COPY_CONFIGURATION: ${{ inputs.copy_configuration_comparison }}
        run: |
          if [[ "$NATIVE_PROBE" == true && "$FAIRNESS_DIAGNOSTIC" == true ]]; then
            echo 'Select native_probe or fairness_diagnostic, not both.' >&2
            exit 1
          fi
          case "$PROBE_ARCH" in both|arm64|amd64) ;; *) exit 1 ;; esac
          case "$COPY_CONFIGURATION" in disabled|pacing|toast|transaction_trace|transaction_trace_phases|manifest_cleanup|manifest_patch) ;; *) exit 1 ;; esac
          if [[ "$COPY_CONFIGURATION" != disabled && ( "$NATIVE_PROBE" != true || "$FAIRNESS_DIAGNOSTIC" == true || "$CHECKPOINT_SPLIT" == true || "$CHECKPOINT_COMPARE" == true || "$COPY_CHUNK" != disabled || "$STAGING_CHUNKS" == true || "$STAGING_PAUSE" != 0 ) ]]; then
            echo 'Copy configuration comparison requires its own native probe with all overlays disabled.' >&2
            exit 1
          fi
          if [[ "$NATIVE_PROBE" != true && "$PROBE_ARCH" != both ]]; then
            echo 'Architecture selection requires native_probe=true.' >&2
            exit 1
          fi
          if [[ "$CHECKPOINT_SPLIT" == true && ( "$NATIVE_PROBE" != true || "$PROBE_ARCH" != arm64 ) ]]; then
            echo 'Checkpoint overlay diagnostics require native_probe=true and probe_arch=arm64.' >&2
            exit 1
          fi
          if [[ "$CHECKPOINT_COMPARE" == true && ( "$NATIVE_PROBE" != true || "$PROBE_ARCH" != arm64 || "$CHECKPOINT_SPLIT" == true ) ]]; then
            echo 'Checkpoint comparison requires an ARM64 native probe and cannot combine with the overlay safety diagnostic.' >&2
            exit 1
          fi
          case "$COPY_CHUNK" in disabled|2000|4000) ;; *) exit 1 ;; esac
          case "$STAGING_PAUSE" in 0|40) ;; *) exit 1 ;; esac
          if [[ "$STAGING_PAUSE" != 0 && "$STAGING_CHUNKS" != true ]]; then
            echo 'Post-commit pacing requires staging_chunk_comparison=true.' >&2
            exit 1
          fi
          if [[ "$STAGING_CHUNKS" == true && ( "$NATIVE_PROBE" != true || "$PROBE_ARCH" != arm64 || "$CHECKPOINT_SPLIT" == true || "$CHECKPOINT_COMPARE" == true || "$COPY_CHUNK" != disabled ) ]]; then
            echo 'Staging chunk comparison requires its own ARM64 native probe.' >&2
            exit 1
          fi
          if [[ "$COPY_CHUNK" != disabled && ( "$NATIVE_PROBE" != true || "$PROBE_ARCH" != arm64 || "$CHECKPOINT_SPLIT" == true || "$CHECKPOINT_COMPARE" == true ) ]]; then
            echo 'Copy chunk comparison requires its own ARM64 native probe.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute a checkout selected by the artifact-run input.
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
      - name: Validate the successful candidate CI revision
        env:
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$ARTIFACT_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          python3 tests/qualification/candidate.py "$RUNNER_TEMP/candidate-run.json"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: install-bundle-${{ matrix.arch }}
          path: dist/release
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate provenance
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          make -C extensions/lake_replication generate
          mkdir -p .qualification
          cp "$RUNNER_TEMP/candidate-run.json" .qualification/candidate-run.json
          python3 - <<'PY'
          import hashlib, json, os, tarfile
          from pathlib import Path
          archive = Path(os.environ['QUALIFICATION_ARCHIVE'])
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          checksum, name = Path(str(archive) + '.sha256').read_text().split()
          assert checksum == digest and name == archive.name
          with tarfile.open(archive) as bundle:
              members = [m for m in bundle.getmembers() if m.name.endswith('/SOURCE_REVISION')]
              assert len(members) == 1
              revision = bundle.extractfile(members[0]).read().decode().strip()
              for sql in Path('extensions/lake_replication').glob('lake_replication--*.sql'):
                  matches = [m for m in bundle.getmembers() if m.name.endswith('/payload/extension/' + sql.name)]
                  assert len(matches) == 1, sql.name
                  assert bundle.extractfile(matches[0]).read() == sql.read_bytes(), sql.name
              prerequisite = Path('deploy/pg_lake')
              for source in prerequisite.rglob('*'):
                  if not source.is_file() or '__pycache__' in source.parts:
                      continue
                  suffix = '/PG_LAKE_PREREQUISITE/' + source.relative_to(prerequisite).as_posix()
                  matches = [m for m in bundle.getmembers() if m.name.endswith(suffix)]
                  assert len(matches) == 1, suffix
                  assert bundle.extractfile(matches[0]).read() == source.read_bytes(), suffix
          assert revision == os.environ['CANDIDATE_SHA'], (revision, os.environ['CANDIDATE_SHA'])
          Path('.qualification/candidate-artifact.json').write_text(json.dumps({
              'run_id': os.environ['ARTIFACT_RUN_ID'], 'source_revision': revision,
              'archive': archive.name, 'sha256': digest,
              'receiver_sql_overlay_identical_to_archive': True,
          }, indent=2) + '\n')
          PY
      - name: Reclaim unused SDK space on the AMD64 probe runner
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          mkdir -p .qualification/disk
          df -h > .qualification/disk/before-sdk-cleanup.txt
          # Ephemeral hosted runner: these SDKs are unused by the Docker-based build.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h > .qualification/disk/after-sdk-cleanup.txt
      - name: Build and verify source-pinned storage fixtures
        run: python3 tests/qualification/storage_preflight.py
      - name: Reclaim storage fixture build cache
        run: |
          mkdir -p .qualification/disk
          df -h > .qualification/disk/before-storage-cache-cleanup.txt
          docker system df >> .qualification/disk/before-storage-cache-cleanup.txt
          docker builder prune --all --force
          df -h > .qualification/disk/after-storage-cache-cleanup.txt
      - name: Resolve source-keyed prerequisite cache
        id: prerequisite_key
        # Do not restore entries written before candidate trust was enforced.
        run: echo "key=trusted-default-v1-$(python3 tests/qualification/prerequisite.py key)" >> "$GITHUB_OUTPUT"
      - name: Restore prerequisite image archive
        id: prerequisite_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/lake-prerequisite-cache
          key: ${{ steps.prerequisite_key.outputs.key }}
      - name: Verify and load cached prerequisite image
        if: ${{ steps.prerequisite_cache.outputs.cache-hit == 'true' }}
        run: python3 tests/qualification/prerequisite.py load "$RUNNER_TEMP/lake-prerequisite-cache"
      - name: Prepare upstream-only prerequisite image
        timeout-minutes: 60
        run: |
          set -o pipefail
          python3 tests/qualification/prerequisite.py build 2>&1 | tee .qualification/prerequisite-build.log
      - name: Reclaim prerequisite build cache before export
        if: ${{ steps.prerequisite_cache.outputs.cache-hit != 'true' }}
        run: |
          df -h > .qualification/disk/before-prerequisite-cache-cleanup.txt
          docker system df >> .qualification/disk/before-prerequisite-cache-cleanup.txt
          docker builder prune --all --force
          df -h > .qualification/disk/after-prerequisite-cache-cleanup.txt
          docker system df >> .qualification/disk/after-prerequisite-cache-cleanup.txt
      - name: Export optional prerequisite cache
        if: ${{ steps.prerequisite_cache.outputs.cache-hit != 'true' }}
        id: prerequisite_export
        continue-on-error: true
        timeout-minutes: 10
        run: python3 tests/qualification/prerequisite.py save "$RUNNER_TEMP/lake-prerequisite-cache"
      - name: Save verified prerequisite cache
        if: ${{ steps.prerequisite_export.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/lake-prerequisite-cache
          key: ${{ steps.prerequisite_key.outputs.key }}
      - name: Free the local cache archive before replication
        run: |
          rm -f "$RUNNER_TEMP/lake-prerequisite-cache/pg-lake-base.tar.gz" \
                "$RUNNER_TEMP/lake-prerequisite-cache/manifest.json"
          df -h > .qualification/disk/before-native-probe.txt
      - name: Controlled copy-contention diagnostic
        if: ${{ inputs.fairness_diagnostic }}
        run: |
          # Each invocation uses fresh volumes and the same archived package.
          # Run both controls even if a previous case reports a finding.
          status=0
          for copies in 1 4 1; do
            python3 tests/admission/probe.py --cases fairness --fairness-copies "$copies" || status=1
          done
          exit "$status"
      - name: Focused native admission and four-copy probe
        if: ${{ inputs.native_probe && inputs.copy_configuration_comparison == 'disabled' && !inputs.checkpoint_split_diagnostic && !inputs.checkpoint_split_comparison && !inputs.staging_chunk_comparison && inputs.copy_chunk_comparison == 'disabled' }}
        timeout-minutes: 15
        run: python3 tests/admission/probe.py --cases pipeline managed fairness
      - name: Configured copy comparison
        if: ${{ inputs.native_probe && (inputs.copy_configuration_comparison == 'pacing' || inputs.copy_configuration_comparison == 'toast') }}
        timeout-minutes: 20
        env:
          COMPARISON_MODE: ${{ inputs.copy_configuration_comparison }}
        run: python3 tests/admission/copy_configuration_compare.py --mode "$COMPARISON_MODE" --cpuset 0-1
      - name: Matched publication transaction diagnostic
        if: ${{ inputs.native_probe && (inputs.copy_configuration_comparison == 'transaction_trace' || inputs.copy_configuration_comparison == 'transaction_trace_phases') }}
        timeout-minutes: 15
        env:
          TRACE_MODE: ${{ inputs.copy_configuration_comparison }}
        run: |
          args=(--cpuset 0-1 --trace-workers)
          if [[ "$TRACE_MODE" == transaction_trace_phases ]]; then
            args+=(--trace-phases)
          fi
          python3 tests/admission/sql_profile_probe.py "${args[@]}"
      - name: Guarded manifest cleanup comparison (upstream binary overlay)
        if: ${{ inputs.native_probe && inputs.copy_configuration_comparison == 'manifest_cleanup' }}
        timeout-minutes: 20
        run: python3 tests/admission/manifest_cleanup_compare.py --cpuset 0-1
      - name: Unguarded manifest patch verification (upstream binary overlay)
        if: ${{ inputs.native_probe && inputs.copy_configuration_comparison == 'manifest_patch' }}
        timeout-minutes: 20
        run: |
          python3 tests/admission/manifest_patch_verify.py --correctness-only
          python3 tests/admission/manifest_patch_verify.py --cpuset 0-1
      - name: Checkpoint partition prototype diagnostic (SQL overlay)
        if: ${{ inputs.native_probe && inputs.checkpoint_split_diagnostic }}
        timeout-minutes: 15
        run: python3 tests/admission/checkpoint_split_probe.py --cases managed fairness --cpuset 0-1
      - name: Checkpoint original-split-original comparison (performance diagnostic)
        if: ${{ inputs.native_probe && inputs.checkpoint_split_comparison }}
        # Three fixed workloads, each retaining its own unchanged timing gates.
        timeout-minutes: 20
        run: python3 tests/admission/checkpoint_compare.py --cpuset 0-1
      - name: Bulk copy row-cap comparison (SQL and worker configuration overlays)
        if: ${{ inputs.native_probe && inputs.copy_chunk_comparison != 'disabled' }}
        timeout-minutes: 20
        env:
          COPY_CHUNK: ${{ inputs.copy_chunk_comparison }}
        run: python3 tests/admission/checkpoint_compare.py --cpuset 0-1 --copy-chunk-rows "$COPY_CHUNK"
      - name: Staging representation comparison (SQL overlays, unchanged worker and copy limits)
        if: ${{ inputs.native_probe && inputs.staging_chunk_comparison }}
        timeout-minutes: 20
        env:
          STAGING_PAUSE: ${{ inputs.staging_chunk_pause_ms }}
        run: |
          comparison_args=(--chunk-store --cpuset 0-1)
          if [[ "$STAGING_PAUSE" != 0 ]]; then
            comparison_args+=(--chunk-pause-ms "$STAGING_PAUSE")
          fi
          python3 tests/admission/checkpoint_compare.py "${comparison_args[@]}"
      - name: Fresh packaged lifecycle
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        run: make lifecycle-test
      - name: Archived worker TLS and SCRAM
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        run: python3 tests/qualification/tls.py
      - name: Forced Rust child crashes
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        run: make lifecycle-fault-test
      - name: Receiver regressions with unchanged archived SQL and binaries
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        run: python3 tests/streaming/empty_filtered.py --archive-only --native-bulk
      - name: Check out the preserved beta.2 source
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9cfee8fb7d1ca581b089ac649852152f508c0ae9
          path: .qualification/beta2-source
      - name: Reclaim prerequisite build cache before beta.2 build
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        run: |
          df -h > .qualification/disk/before-beta2-cache-cleanup.txt
          docker system df >> .qualification/disk/before-beta2-cache-cleanup.txt
          # Preserve tagged pg_lake/source/storage/runtime images and volumes.
          docker builder prune --all --force
          df -h > .qualification/disk/after-beta2-cache-cleanup.txt
      - name: Build the beta.2 package for admission upgrade qualification
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        working-directory: .qualification/beta2-source
        env:
          ARCHES: ${{ matrix.arch }}
        run: ./deploy/install/build-release.sh "$GITHUB_WORKSPACE/.qualification/beta2-artifacts"
      - name: Coordinated physical upgrade rollback
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        env:
          OLD_ARCHIVE: ${{ github.workspace }}/.qualification/beta2-artifacts/lake_replication-0.1.0-beta.2-linux-${{ matrix.arch }}.tar.gz
        run: python3 tests/qualification/recovery.py --old-archive "$OLD_ARCHIVE"
      - name: Production admission and beta.2 upgrade
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        env:
          OLD_ARCHIVE: ${{ github.workspace }}/.qualification/beta2-artifacts/lake_replication-0.1.0-beta.2-linux-${{ matrix.arch }}.tar.gz
        run: python3 tests/admission/probe.py --old-archive "$OLD_ARCHIVE"
      - name: Check out the preserved beta.1 source
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 85a32b4bf8092b9b2dd8e4ae4dc615084c7eb9b9
          path: .qualification/legacy-source
      - name: Reclaim build cache before beta.1 build
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        run: |
          df -h > .qualification/disk/before-beta1-cache-cleanup.txt
          docker system df >> .qualification/disk/before-beta1-cache-cleanup.txt
          docker builder prune --all --force
          df -h > .qualification/disk/after-beta1-cache-cleanup.txt
      - name: Build the real beta.1 package for this architecture
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        working-directory: .qualification/legacy-source
        env:
          ARCHES: ${{ matrix.arch }}
        run: ./deploy/install/build-release.sh "$GITHUB_WORKSPACE/.qualification/legacy-artifacts"
      - name: Packaged beta.1 upgrade handoff
        if: ${{ !inputs.fairness_diagnostic && !inputs.native_probe }}
        env:
          OLD_ARCHIVE: ${{ github.workspace }}/.qualification/legacy-artifacts/lake_replication-0.1.0-beta.1-linux-${{ matrix.arch }}.tar.gz
        run: python3 tests/lifecycle/probe.py --upgrade --old-archive "$OLD_ARCHIVE"
      - name: Upload qualification evidence and legacy package
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lifecycle-qualification-${{ matrix.arch }}
          path: |
            .qualification/
            !.qualification/legacy-source/
            !.qualification/beta2-source/
            !.qualification/**/private-snapshot/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
