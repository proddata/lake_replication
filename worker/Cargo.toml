[package]
name = "lake-replication-worker"
version = "0.1.0-beta.5"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
push-prototype = []

[dependencies]
libc = "=0.2.189"
postgres-protocol = "=0.6.12"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "=2.2.0"
sha2 = "=0.11.0"

[lib]
name = "lake_replication_worker"
path = "src/lib.rs"

[[bin]]
name = "lake-replication-receiver"
path = "src/main.rs"

[[bin]]
name = "lake-replication-publisher"
path = "src/publisher.rs"

[[bin]]
name = "lake-replication-initial-sync"
path = "src/initial_sync.rs"

[[bin]]
name = "lake-replication-supervisor"
path = "src/supervisor.rs"

[[bin]]
name = "lake-replication-log-importer"
path = "src/log_importer.rs"
required-features = ["push-prototype"]

[[bin]]
name = "lake-replication-capture"
path = "src/capture.rs"
required-features = ["push-prototype"]

[[bin]]
name = "lake-replication-push-publisher"
path = "src/push_publisher.rs"
required-features = ["push-prototype"]
